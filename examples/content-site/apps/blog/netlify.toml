[build]
  command = "cd ../.. && ./node_modules/.bin/devora build --app=blog --adapter=netlify"
  publish = "dist/client"
  functions = "netlify/functions"

[functions.ssr]
  included_files = ["netlify/functions/ssr/routes/**", "netlify/functions/ssr/endpoints/**", "netlify/functions/ssr/dist/**", "netlify/functions/ssr/package.json", "netlify/functions/ssr/node_modules/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
