name: CI

# Runs a real `devora build` (plain, and both --adapter targets) for every
# app under all three supported package managers on every push/PR — the
# actual gate that would have caught this session's three real deploy bugs
# (react/react-dom left out of the Vercel function, devora build silently
# depending on the caller's NODE_ENV, netlify.toml only ever existing as
# build output) before any of them ever reached a live deployment. See
# docs/history/BUILD-LOG.md #4 for the full account of each.
#
# Also runs the real Vitest suite (packages/**/*.test.ts) — regression
# protection that persists, replacing the "verify by hand via curl, then
# throw the script away" pattern this project's development used until now.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The token every job gets can only read the repository.
permissions:
  contents: read

jobs:
  # Dependency audit. The first step fails on a known vulnerability of high or critical severity in anything
  # that ships or runs when someone uses the framework (`--prod`: the CLI, vite, the runtime packages).
  # The second step lists everything else, test tooling included, and does not fail the job: today it
  # reports the vitest 2.x test runner (see finding H18 in ROADMAP.md). pnpm 9.15 is used because the audit
  # endpoint older pnpm releases call has been retired. When the first step fails, upgrade the package; if
  # an advisory does not apply, say why in `pnpm.auditConfig.ignoreGhsas` rather than turning the job off.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.15.9
      - name: Audit shipped dependencies (fails on high or critical)
        run: pnpm audit --prod --audit-level high
      - name: Audit everything, test tooling included (report only)
        run: pnpm audit --audit-level high
        continue-on-error: true

  build:
    strategy:
      fail-fast: false
      matrix:
        package-manager: [pnpm, npm, yarn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm is installed directly (not via corepack) for the pnpm leg of
      # the matrix. Root package.json deliberately has no "packageManager"
      # field (removed earlier — it broke plain Node's yarn corepack shim,
      # see README.md's cross-package-manager notes), which leaves corepack
      # with no pinned version to activate for pnpm and fails fast on
      # GitHub's runners (a known corepack signature/keyid verification
      # issue when no packageManager field is present). pnpm/action-setup
      # sidesteps corepack entirely for this leg, so it can't regress the
      # yarn fix. Version pinned to 9.9.0 to match this repo's actual
      # development version (see pnpm-lock.yaml).
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: matrix.package-manager == 'pnpm'
        with:
          version: 9.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          # No cache: key — this repo has no single lockfile all three
          # managers share (see README.md's cross-package-manager notes),
          # and this workflow's whole point is exercising a real install
          # under each manager, not shortcutting it.

      - name: Enable corepack
        if: matrix.package-manager != 'pnpm'
        run: corepack enable

      - name: Install (pnpm)
        if: matrix.package-manager == 'pnpm'
        run: pnpm install

      - name: Install (npm)
        if: matrix.package-manager == 'npm'
        run: npm install

      - name: Install (yarn)
        if: matrix.package-manager == 'yarn'
        run: yarn install

      # Only pnpm is used from here — the point of the matrix above is
      # proving `install` itself succeeds under all three (this is exactly
      # what surfaced the ERR_PNPM_FETCH_404 / packageManager-pin issues
      # documented in README.md); the build/typecheck steps below don't
      # need repeating three times with identical inputs once install is
      # confirmed to have linked the workspace correctly.
      - name: Typecheck @devorajs/core, @devorajs/cli, the adapters, @devorajs/scaffold, create-devora
        if: matrix.package-manager == 'pnpm'
        run: |
          pnpm --filter @devorajs/core exec tsc --noEmit
          pnpm --filter @devorajs/cli exec tsc --noEmit
          pnpm --filter @devorajs/adapter-node exec tsc --noEmit
          pnpm --filter @devorajs/adapter-vercel exec tsc --noEmit
          pnpm --filter @devorajs/adapter-netlify exec tsc --noEmit
          pnpm --filter @devorajs/scaffold exec tsc --noEmit
          pnpm --filter create-devora exec tsc --noEmit

      - name: Rebuild CLI bundle
        if: matrix.package-manager == 'pnpm'
        run: pnpm --filter @devorajs/cli build

      - name: Run test suite
        if: matrix.package-manager == 'pnpm'
        run: pnpm run test

      # Every relative Markdown link resolves, and no document names an old version as current or uses
      # wording about an unfinished release outside the CHANGELOG and docs/history.
      - name: Check documents
        if: matrix.package-manager == 'pnpm'
        run: pnpm run check:docs

      # What `npm pack` would publish, for every published package: fails on a file that should not be in a
      # tarball (secrets, tests, source, configs, leftovers), a file outside the package's `files`, or a
      # dist/ that does not match src/. Needs the packages built first.
      - name: Check the contents of every package tarball
        if: matrix.package-manager == 'pnpm'
        run: |
          pnpm --filter @devorajs/core --filter @devorajs/adapter-node --filter @devorajs/adapter-vercel --filter @devorajs/adapter-netlify --filter create-devora run build
          node scripts/checkPackContents.mjs

      # Fresh create-devora projects (full-stack and backend-only), installed
      # from the packed tarballs and typechecked with their own `typecheck`
      # script — tests the published .d.ts files the way a user gets them.
      - name: Typecheck a fresh scaffold against the built packages
        if: matrix.package-manager == 'pnpm'
        run: node scripts/typecheck-fresh-scaffold.mjs

      # adapter-node is published on its own: install its packed tarball in
      # an empty folder and import it with plain Node.
      - name: Smoke-test the packed @devorajs/adapter-node
        if: matrix.package-manager == 'pnpm'
        run: node scripts/smoke-adapter-node.mjs

      - name: Build every app (plain, adapter-node target)
        if: matrix.package-manager == 'pnpm'
        run: |
          node packages/cli/dist/index.js build --app=marketing
          node packages/cli/dist/index.js build --app=dashboard
          node packages/cli/dist/index.js build --app=admin
          node packages/cli/dist/index.js build --app=api-only

      - name: Build every app (--adapter=vercel)
        if: matrix.package-manager == 'pnpm'
        run: |
          node packages/cli/dist/index.js build --app=marketing --adapter=vercel
          node packages/cli/dist/index.js build --app=dashboard --adapter=vercel
          node packages/cli/dist/index.js build --app=admin --adapter=vercel
          node packages/cli/dist/index.js build --app=api-only --adapter=vercel

      - name: Build every app (--adapter=netlify)
        if: matrix.package-manager == 'pnpm'
        run: |
          node packages/cli/dist/index.js build --app=marketing --adapter=netlify
          node packages/cli/dist/index.js build --app=dashboard --adapter=netlify
          node packages/cli/dist/index.js build --app=admin --adapter=netlify
          node packages/cli/dist/index.js build --app=api-only --adapter=netlify

  # The package manager table in the docs, backed by a run: a new project from the local create-devora (core and cli packed
  # from this checkout) is installed, typechecked, built and started under Yarn 4 with its default settings and under pnpm
  # 10 and 12. npm, Yarn 1 and pnpm 9 installs are covered by the build job above. See scripts/ci-scaffold-pm.mjs.
  package-managers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pm: [yarn4, pnpm10, pnpm12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: pnpm install --frozen-lockfile
      - name: Build create-devora, core and the CLI
        run: pnpm --filter @devorajs/core --filter @devorajs/cli --filter create-devora run build
      - name: Scaffold, install, build and start under ${{ matrix.pm }}
        run: node scripts/ci-scaffold-pm.mjs ${{ matrix.pm }}

  # The runnable projects in examples/. Each installs the published packages
  # from npm with its own lockfile, so this catches an example that no
  # longer works with what users actually get.
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [multi-app, api-bearer, content-site, realtime, background-jobs]
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node ../check.mjs
