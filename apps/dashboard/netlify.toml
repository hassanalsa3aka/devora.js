# Static, committed config — see apps/marketing/netlify.toml for the full
# explanation of why this exists and isn't build output.
[build]
  command = "cd ../.. && node packages/cli/dist/index.js build --app=dashboard --adapter=netlify"
  publish = "dist/client"
  functions = "netlify/functions"

# A real, confirmed bug from an actual authenticated deploy: without this,
# the function ran with no crash/error but returned "Not found" for every
# route, including "/" — Netlify's function packager only zips up what it
# can trace from ssr.mjs's static imports; routes/ and dist/server/ are
# read at runtime via fs.readdirSync/dynamic import(), invisible to that
# tracer. See ROADMAP.md #4/#13's "real live deploy" account.
#
# `.../ssr/package.json` added for the identical reason, found the same
# way (a real live deploy, this time on apps/admin — still throwing
# "Cannot use import statement outside a module" even after adapter-netlify
# was fixed to write that file): the file exists in every local build, but
# was neither imported nor listed here, so the tracer never included it in
# the deployed function either. Anything read at runtime instead of
# statically imported has to be named in this list explicitly — no
# exceptions, package.json included.
#
# `.../ssr/node_modules/**` added for a third real bug found the same way
# on apps/admin: `Cannot find package 'react'` at request time, even
# after the two fixes above landed — the vendored react/react-dom package
# trees (`vendorRuntimeDependency`) exist in every local build but hit the
# identical tracer blind spot.
[functions.ssr]
  included_files = ["netlify/functions/ssr/routes/**", "netlify/functions/ssr/api/**", "netlify/functions/ssr/dist/**", "netlify/functions/ssr/package.json", "netlify/functions/ssr/node_modules/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
