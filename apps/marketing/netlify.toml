# Static, committed config — read by Netlify before any build runs, the
# same role vercel.json plays for Vercel. Without this, Netlify's dashboard
# falls back to zero-config `vite build` detection, which fails outright
# ("Could not resolve entry module index.html", since this isn't a
# conventional Vite SPA) — a real bug found via an actual live Netlify
# deploy, see ROADMAP.md #4. NOT regenerated by `devora build --adapter=
# netlify` (unlike netlify/functions/ssr, which is real build output) —
# writing this as build output too was exactly the bug: it didn't exist yet
# on the very build that was supposed to produce it.
[build]
  command = "cd ../.. && node packages/cli/dist/index.js build --app=marketing --adapter=netlify"
  publish = "dist/client"
  functions = "netlify/functions"

# A real, confirmed bug from an actual authenticated deploy: without this,
# the function ran with no crash/error but returned "Not found" for every
# route, including "/" — Netlify's function packager only zips up what it
# can trace from ssr.mjs's static imports; routes/ and dist/server/ are
# read at runtime via fs.readdirSync/dynamic import(), invisible to that
# tracer. See ROADMAP.md #4/#13's "real live deploy" account.
#
# `.../ssr/package.json` added for the identical reason — see
# apps/dashboard/netlify.toml's copy of this comment for the full account
# (found via a real live deploy of apps/admin, not this app, since
# marketing's "ssg" render mode never invokes the function for its own
# homepage — but the same bug applies here the moment any route here uses
# ssr/isr/csr).
#
# `.../ssr/node_modules/**` added for a third real bug, same account —
# vendored react/react-dom hit the identical tracer blind spot.
[functions.ssr]
  included_files = ["netlify/functions/ssr/routes/**", "netlify/functions/ssr/api/**", "netlify/functions/ssr/dist/**", "netlify/functions/ssr/package.json", "netlify/functions/ssr/node_modules/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
