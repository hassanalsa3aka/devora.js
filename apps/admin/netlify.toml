# Static, committed config — see apps/marketing/netlify.toml for the full
# explanation of why this exists and isn't build output.
[build]
  command = "cd ../.. && node packages/cli/dist/index.js build --app=admin --adapter=netlify"
  publish = "dist/client"
  functions = "netlify/functions"

# See apps/dashboard/netlify.toml for why this exists — a real, confirmed
# bug from an actual authenticated deploy (ROADMAP.md #4/#13).
#
# `.../ssr/package.json` added here for the same underlying reason:
# Netlify's function packager only zips up what it can statically trace
# from ssr.mjs's imports, PLUS whatever included_files explicitly lists —
# the plain `package.json` (`{"type":"module"}`) adapter-netlify writes
# into the function directory, to make Node treat dist/server/**/*.js as
# real ESM instead of defaulting to CommonJS, is neither imported nor
# previously listed here, so it never reached the deployed function at
# all despite existing in every local build — confirmed via a real deploy
# still throwing "Cannot use import statement outside a module" even
# after that fix landed. Same root cause as the rest of this list: a file
# read at runtime, not statically imported, is invisible to the tracer
# unless named here explicitly.
#
# `.../ssr/node_modules/**` added for a third real bug, the next one hit
# once the two fixes above actually landed: the real, resolved react/
# react-dom package trees adapter-netlify vendors into the function's own
# node_modules (`vendorRuntimeDependency`) exist in every local build, but
# still never reached the deployed function either — confirmed via a real
# deploy throwing `Cannot find package 'react'` at request time even after
# the ESM fix. Same tracer blind spot as everything else in this list:
# vendored dependencies aren't a static import target the tracer follows,
# they're files placed on disk for Node's own runtime resolution to find.
[functions.ssr]
  included_files = ["netlify/functions/ssr/routes/**", "netlify/functions/ssr/api/**", "netlify/functions/ssr/dist/**", "netlify/functions/ssr/package.json", "netlify/functions/ssr/node_modules/**"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/ssr"
  status = 200
